apiVersion: apps/v1
kind: Deployment
metadata:
  name: pharmago-pharmacy-service
  namespace: pharmago
  labels:
    app: pharmago-pharmacy-service
    app.kubernetes.io/part-of: pharmago
    pharmago/tier: backend
spec:
  # Alta disponibilidad: 2 réplicas stateless (las sesiones viven en la BD).
  replicas: 2
  revisionHistoryLimit: 5
  # Despliegue seguro: nunca baja de 2 réplicas listas; primero levanta la nueva
  # y recién cuando está READY durante minReadySeconds da de baja una vieja.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  minReadySeconds: 5
  progressDeadlineSeconds: 300
  selector:
    matchLabels:
      app: pharmago-pharmacy-service
  template:
    metadata:
      labels:
        app: pharmago-pharmacy-service
        app.kubernetes.io/part-of: pharmago
        pharmago/tier: backend
    spec:
      # Debe superar preStop (5 s) + apagado ordenado de ASP.NET Core (5 s por defecto).
      terminationGracePeriodSeconds: 30
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: node-type
                operator: In
                values: [backend, all]
        # "preferred" porque Minikube tiene un solo nodo: con "required" las
        # réplicas quedarían en Pending. En multinodo el término entre
        # microservicios distintos pasa a "required".
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          # No compartir nodo con OTRO microservicio backend.
          - weight: 100
            podAffinityTerm:
              topologyKey: kubernetes.io/hostname
              labelSelector:
                matchExpressions:
                - key: pharmago/tier
                  operator: In
                  values: [backend]
                - key: app
                  operator: NotIn
                  values: [pharmago-pharmacy-service]
          # Repartir las réplicas del mismo microservicio en nodos distintos.
          - weight: 50
            podAffinityTerm:
              topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  app: pharmago-pharmacy-service
      # Nodos backend dedicados en multinodo (taint dedicated=backend:NoSchedule).
      # En Minikube no hay taints y la toleration no tiene efecto.
      tolerations:
      - key: dedicated
        operator: Equal
        value: backend
        effect: NoSchedule
      containers:
      - name: pharmago-pharmacy-service
        image: pharmago-pharmacy-service:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 80
        env:
        - name: ConnectionStrings__DefaultConnection
          value: "Server=pharmago-db;Database=PharmaDb;User Id=sa;Password=Str0ngP@ssword!"
        - name: ServiceUrls__UsersService
          value: "http://pharmago-users-service:80"
        - name: ASPNETCORE_ENVIRONMENT
          value: "Production"
        - name: Logging__LogLevel__Microsoft.EntityFrameworkCore
          value: "None"
        - name: Logging__LogLevel__Microsoft.Data.SqlClient
          value: "None"
        # Recursos reducidos para nodos ~5GB (proyecto docente)
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "384Mi"
            cpu: "500m"
        # /health no registra checks: responde 200 mientras el proceso atiende.
        # Es la semántica correcta para liveness (una caída de la BD no debe
        # reiniciar todos los pods). Las fallas de la BD las corta el gateway.
        startupProbe:
          httpGet:
            path: /health
            port: 80
          periodSeconds: 2
          timeoutSeconds: 2
          failureThreshold: 90
        # Readiness: saca al pod del Service en ~6 s (2 fallas x 3 s).
        readinessProbe:
          httpGet:
            path: /health
            port: 80
          periodSeconds: 3
          timeoutSeconds: 2
          failureThreshold: 2
          successThreshold: 1
        # Liveness: reinicia un contenedor colgado en ~15 s (3 fallas x 5 s).
        livenessProbe:
          httpGet:
            path: /health
            port: 80
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
          # Solo cuando reinicia la liveness. Un proceso colgado no atiende SIGTERM:
          # esperar los 30 s del pod solo alarga el MTTR. Rollouts y borrados siguen con 30 s.
          terminationGracePeriodSeconds: 5
        lifecycle:
          preStop:
            # Da tiempo a que el endpoint salga del Service (kube-proxy) antes
            # del SIGTERM, así ninguna conexión nueva llega a un pod que se apaga.
            exec:
              command: ["sleep", "5"]
