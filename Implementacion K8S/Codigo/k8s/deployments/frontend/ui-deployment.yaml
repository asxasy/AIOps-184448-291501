apiVersion: apps/v1
kind: Deployment
metadata:
  name: pharmago-ui
  namespace: pharmago
  labels:
    app: pharmago-ui
    app.kubernetes.io/part-of: pharmago
    pharmago/tier: frontend
spec:
  # Alta disponibilidad: 2 réplicas de nginx sirviendo estáticos (stateless).
  replicas: 2
  selector:
    matchLabels:
      app: pharmago-ui
  template:
    metadata:
      labels:
        app: pharmago-ui
        app.kubernetes.io/part-of: pharmago
        pharmago/tier: frontend
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: node-type
                operator: In
                values: [frontend, all]
        # "preferred" porque Minikube tiene un solo nodo.
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 50
            podAffinityTerm:
              topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  app: pharmago-ui
      # Nodos frontend dedicados en multinodo (taint dedicated=frontend:NoSchedule).
      tolerations:
      - key: dedicated
        operator: Equal
        value: frontend
        effect: NoSchedule
      containers:
      - name: pharmago-ui
        image: pharmago-ui:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 80
        # nginx sirviendo estáticos usa pocos MB: se baja el request de 128Mi a
        # 64Mi para dejar margen en el nodo.
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "200m"
        readinessProbe:
          httpGet:
            path: /
            port: 80
          periodSeconds: 3
          timeoutSeconds: 2
          failureThreshold: 2
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
