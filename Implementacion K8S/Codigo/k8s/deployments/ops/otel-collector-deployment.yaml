apiVersion: apps/v1
kind: Deployment
metadata:
  name: otlp-collector
  namespace: pharmago
spec:
  replicas: 1
  selector:
    matchLabels:
      app: otlp-collector
  template:
    metadata:
      labels:
        app: otlp-collector
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: node-type
                operator: In
                values: [ops, all]
      containers:
      - name: otlp-collector
        # Versión fija: con :latest un release nuevo puede cambiar claves de configuración.
        image: otel/opentelemetry-collector-contrib:0.162.0
        ports:
        - containerPort: 4317
          name: otlp-grpc
        - containerPort: 8889
          name: prometheus
        args:
          - "--config=/etc/otel-collector-config.yaml"
        # Con límite de memoria el processor memory_limiter (80 %) tiene un techo de referencia.
        resources:
          requests:
            memory: "96Mi"
            cpu: "50m"
          limits:
            memory: "256Mi"
            cpu: "300m"
        volumeMounts:
        - name: otel-config
          mountPath: /etc/otel-collector-config.yaml
          subPath: otel-collector-config.yaml
      volumes:
      - name: otel-config
        configMap:
          name: otel-collector-config

