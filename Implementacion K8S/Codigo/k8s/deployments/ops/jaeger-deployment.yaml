# Jaeger v2: recibe trazas por OTLP desde el otel-collector y las muestra en su UI (puerto 16686).
# La configuración (memoria acotada a 5000 trazas, puertos) está en configmaps/jaeger-config.yaml.
# Versión fija 2.20.0, no la última: la 2.21.0 sacó los endpoints HTTP /api/services y /api/traces,
# que son los que usa el data source Jaeger de Grafana 10.4. Jaeger v1 (all-in-one 1.x) no tiene
# soporte desde el 31/12/2025.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger
  namespace: pharmago
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: jaeger
  template:
    metadata:
      labels:
        app: jaeger
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: node-type
                operator: In
                values: [ops, all]
      # Nodos ops dedicados en multinodo (taint dedicated=ops:NoSchedule).
      # En Minikube no hay taints y la toleration no tiene efecto.
      tolerations:
      - key: dedicated
        operator: Equal
        value: ops
        effect: NoSchedule
      containers:
      - name: jaeger
        image: jaegertracing/jaeger:2.20.0
        args:
          - "--config=/etc/jaeger/config.yaml"
        env:
        # El GC de Go respeta este techo antes de llegar al límite del contenedor.
        - name: GOMEMLIMIT
          value: "320MiB"
        ports:
        - containerPort: 4317
          name: otlp-grpc
        - containerPort: 16686
          name: ui
        - containerPort: 8888
          name: metrics
        - containerPort: 13133
          name: health
        resources:
          requests:
            memory: "128Mi"
            cpu: "50m"
          limits:
            memory: "384Mi"
            cpu: "300m"
        readinessProbe:
          httpGet:
            path: /status
            port: 13133
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /status
            port: 13133
          initialDelaySeconds: 15
          periodSeconds: 30
        volumeMounts:
        - name: jaeger-config
          mountPath: /etc/jaeger
          readOnly: true
      volumes:
      - name: jaeger-config
        configMap:
          name: jaeger-config
