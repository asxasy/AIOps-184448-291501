# Jaeger all-in-one: recibe trazas por OTLP desde el otel-collector y las muestra en su UI (puerto 16686).
# Almacenamiento en memoria acotado a 5000 trazas: se pierden al reiniciar el pod, alcanza para la demo.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger
  namespace: pharmago
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: jaeger
  template:
    metadata:
      labels:
        app: jaeger
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: node-type
                operator: In
                values: [ops, all]
      # Nodos ops dedicados en multinodo (taint dedicated=ops:NoSchedule).
      # En Minikube no hay taints y la toleration no tiene efecto.
      tolerations:
      - key: dedicated
        operator: Equal
        value: ops
        effect: NoSchedule
      containers:
      - name: jaeger
        image: jaegertracing/all-in-one:1.76.0
        args:
          - "--memory.max-traces=5000"
        env:
        - name: SPAN_STORAGE_TYPE
          value: "memory"
        - name: COLLECTOR_OTLP_ENABLED
          value: "true"
        # El GC de Go respeta este techo antes de llegar al límite del contenedor.
        - name: GOMEMLIMIT
          value: "320MiB"
        ports:
        - containerPort: 4317
          name: otlp-grpc
        - containerPort: 16686
          name: ui
        - containerPort: 14269
          name: admin
        resources:
          requests:
            memory: "128Mi"
            cpu: "50m"
          limits:
            memory: "384Mi"
            cpu: "300m"
        readinessProbe:
          httpGet:
            path: /
            port: 14269
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /
            port: 14269
          initialDelaySeconds: 15
          periodSeconds: 30
