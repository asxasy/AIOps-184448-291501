# Solo interno: el collector llega por DNS (jaeger:4317), Grafana consulta la API en jaeger:16686,
# Prometheus scrapea jaeger:8888 y la UI se abre con port-forward
# (kubectl port-forward svc/jaeger 16686:16686 -n pharmago). No se expone la ingesta OTLP fuera del clúster.
apiVersion: v1
kind: Service
metadata:
  name: jaeger
  namespace: pharmago
spec:
  selector:
    app: jaeger
  ports:
  - port: 4317
    targetPort: 4317
    protocol: TCP
    name: otlp-grpc
  - port: 16686
    targetPort: 16686
    protocol: TCP
    name: ui
  - port: 8888
    targetPort: 8888
    protocol: TCP
    name: metrics
  type: ClusterIP
