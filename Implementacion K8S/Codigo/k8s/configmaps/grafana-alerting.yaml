# Alertas de Grafana provisionadas por archivo (Grafana 10.4 lee /etc/grafana/provisioning/alerting/*.yaml al arrancar).
# Contiene las tres piezas que necesita: reglas (groups), contact point y notification policy.
# Contact point: webhook que indexa cada notificación en Elasticsearch (índice pharmago-alerts),
# así el historial de alertas también se puede consultar en Kibana. No requiere SMTP.
# Todas las reglas: noDataState OK (sin tráfico no es una falla) y execErrState Error
# (si Prometheus no responde, Grafana dispara DatasourceError).
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-alerting
  namespace: pharmago
data:
  alerting.yaml: |
    apiVersion: 1
    contactPoints:
    - orgId: 1
      name: pharmago-elasticsearch
      receivers:
      - uid: pharmago-es-webhook
        type: webhook
        disableResolveMessage: false
        settings:
          url: http://elasticsearch:9200/pharmago-alerts/_doc
          httpMethod: POST
    policies:
    - orgId: 1
      receiver: pharmago-elasticsearch
      group_by:
      - grafana_folder
      - alertname
      group_wait: 10s
      group_interval: 1m
      repeat_interval: 1h
    groups:
    - orgId: 1
      name: pharmago-aplicacion
      folder: PharmaGo
      interval: 10s
      rules:
      - uid: pharmago-servicio-caido
        title: Servicio caído (up = 0)
        condition: C
        data:
        - refId: A
          relativeTimeRange:
            from: 600
            to: 0
          datasourceUid: prometheus
          model:
            refId: A
            expr: min by (job) (up{job=~"api-gateway|users-service|pharmacy-service|otlp-collector|jaeger|node-exporter"})
            instant: true
            range: false
            editorMode: code
            legendFormat: __auto
            intervalMs: 1000
            maxDataPoints: 43200
        - refId: B
          datasourceUid: __expr__
          model:
            refId: B
            type: reduce
            expression: A
            reducer: last
            datasource:
              type: __expr__
              uid: __expr__
        - refId: C
          datasourceUid: __expr__
          model:
            refId: C
            type: threshold
            expression: B
            datasource:
              type: __expr__
              uid: __expr__
            conditions:
            - evaluator:
                type: lt
                params:
                - 1
        noDataState: OK
        execErrState: Error
        for: 30s
        isPaused: false
        labels:
          severity: critical
          senal: disponibilidad
        annotations:
          summary: "{{ $labels.job }} no responde"
          description: 'Prometheus no puede scrapear {{ $labels.job }} hace más de 30 s: no hay pods listos detrás del Service o no hay conectividad. Revisar kubectl get pods -n pharmago.'
      - uid: pharmago-errores-5xx
        title: Tasa de errores 5xx del Gateway > 5 %
        condition: C
        data:
        - refId: A
          relativeTimeRange:
            from: 600
            to: 0
          datasourceUid: prometheus
          model:
            refId: A
            expr: (sum(rate(pharmago_http_requests_total{exported_job="PharmaGo.ApiGateway", endpoint!~"/metrics|/health|/test-health.*", status_code=~"5.."}[1m])) or on() vector(0)) / sum(rate(pharmago_http_requests_total{exported_job="PharmaGo.ApiGateway", endpoint!~"/metrics|/health|/test-health.*"}[1m]))
            instant: true
            range: false
            editorMode: code
            legendFormat: __auto
            intervalMs: 1000
            maxDataPoints: 43200
        - refId: B
          datasourceUid: __expr__
          model:
            refId: B
            type: reduce
            expression: A
            reducer: last
            datasource:
              type: __expr__
              uid: __expr__
            settings:
              mode: replaceNN
              replaceWithValue: 0
        - refId: C
          datasourceUid: __expr__
          model:
            refId: C
            type: threshold
            expression: B
            datasource:
              type: __expr__
              uid: __expr__
            conditions:
            - evaluator:
                type: gt
                params:
                - 0.05
        noDataState: OK
        execErrState: Error
        for: 30s
        isPaused: false
        labels:
          severity: critical
          senal: errores
        annotations:
          summary: "{{ if $values.B }}{{ humanizePercentage $values.B.Value }}{{ end }} de las respuestas del Gateway son 5xx"
          description: Más del 5 % de las requests que entran por el Gateway terminan en 5xx (502/503 si un microservicio no responde, 500 si falla la base). Buscar la traza con error en Jaeger y los logs por Scopes.TraceId en Kibana.
      - uid: pharmago-latencia-p95
        title: Latencia p95 del Gateway > 1 s
        condition: C
        data:
        - refId: A
          relativeTimeRange:
            from: 600
            to: 0
          datasourceUid: prometheus
          model:
            refId: A
            expr: histogram_quantile(0.95, sum by (le) (rate(pharmago_http_request_duration_milliseconds_bucket{exported_job="PharmaGo.ApiGateway", endpoint!~"/metrics|/health|/test-health.*"}[1m])))
            instant: true
            range: false
            editorMode: code
            legendFormat: __auto
            intervalMs: 1000
            maxDataPoints: 43200
        - refId: B
          datasourceUid: __expr__
          model:
            refId: B
            type: reduce
            expression: A
            reducer: last
            datasource:
              type: __expr__
              uid: __expr__
            settings:
              mode: replaceNN
              replaceWithValue: 0
        - refId: C
          datasourceUid: __expr__
          model:
            refId: C
            type: threshold
            expression: B
            datasource:
              type: __expr__
              uid: __expr__
            conditions:
            - evaluator:
                type: gt
                params:
                - 1000
        noDataState: OK
        execErrState: Error
        for: 30s
        isPaused: false
        labels:
          severity: warning
          senal: latencia
        annotations:
          summary: p95 del Gateway en {{ if $values.B }}{{ humanize $values.B.Value }}{{ end }} ms
          description: 'El 5 % más lento de las requests tarda más de 1 s. Causas típicas: CPU saturada en un microservicio, base de datos caída (timeouts de conexión) o pico de carga. La traza muestra qué tramo (Gateway, servicio o SQL) se lleva el tiempo.'
      - uid: pharmago-pico-trafico
        title: Pico de tráfico en el Gateway (3x la línea base)
        condition: C
        data:
        - refId: A
          relativeTimeRange:
            from: 600
            to: 0
          datasourceUid: prometheus
          model:
            refId: A
            expr: sum(rate(pharmago_http_requests_total{exported_job="PharmaGo.ApiGateway", endpoint!~"/metrics|/health|/test-health.*"}[1m])) or on() vector(0)
            instant: true
            range: false
            editorMode: code
            legendFormat: __auto
            intervalMs: 1000
            maxDataPoints: 43200
        - refId: B
          relativeTimeRange:
            from: 600
            to: 0
          datasourceUid: prometheus
          model:
            refId: B
            expr: sum(rate(pharmago_http_requests_total{exported_job="PharmaGo.ApiGateway", endpoint!~"/metrics|/health|/test-health.*"}[30m])) or on() vector(0)
            instant: true
            range: false
            editorMode: code
            legendFormat: __auto
            intervalMs: 1000
            maxDataPoints: 43200
        - refId: C
          datasourceUid: __expr__
          model:
            refId: C
            type: math
            expression: "$A > 2 && $A > 3 * $B"
            datasource:
              type: __expr__
              uid: __expr__
        noDataState: OK
        execErrState: Error
        for: 15s
        isPaused: false
        labels:
          severity: warning
          senal: trafico
        annotations:
          summary: Tráfico del Gateway 3 veces por encima de su promedio de 30 min
          description: 'Umbral dinámico: el tráfico del último minuto supera 2 req/s y es más de 3 veces el promedio de los últimos 30 min. Indica una inyección de requests o un cliente en loop.'
      - uid: pharmago-rate-limit-429
        title: Rate limiting activo en el Gateway (429)
        condition: C
        data:
        - refId: A
          relativeTimeRange:
            from: 600
            to: 0
          datasourceUid: prometheus
          model:
            refId: A
            expr: sum(rate(pharmago_http_requests_total{exported_job="PharmaGo.ApiGateway", status_code="429"}[1m])) or on() vector(0)
            instant: true
            range: false
            editorMode: code
            legendFormat: __auto
            intervalMs: 1000
            maxDataPoints: 43200
        - refId: B
          datasourceUid: __expr__
          model:
            refId: B
            type: reduce
            expression: A
            reducer: last
            datasource:
              type: __expr__
              uid: __expr__
            settings:
              mode: replaceNN
              replaceWithValue: 0
        - refId: C
          datasourceUid: __expr__
          model:
            refId: C
            type: threshold
            expression: B
            datasource:
              type: __expr__
              uid: __expr__
            conditions:
            - evaluator:
                type: gt
                params:
                - 0.5
        noDataState: OK
        execErrState: Error
        for: 15s
        isPaused: false
        labels:
          severity: warning
          senal: errores
        annotations:
          summary: El Gateway rechaza {{ if $values.B }}{{ humanize $values.B.Value }}{{ end }} req/s con 429
          description: El rate limiting por IP del Gateway está cortando requests (más de 30 por minuto). Esperable durante una inyección de requests; si aparece sin carga de prueba, un cliente está abusando del API.
      - uid: pharmago-caida-trafico
        title: Caída brusca de tráfico en el Gateway
        condition: C
        data:
        - refId: A
          relativeTimeRange:
            from: 600
            to: 0
          datasourceUid: prometheus
          model:
            refId: A
            expr: sum(rate(pharmago_http_requests_total{exported_job="PharmaGo.ApiGateway", endpoint!~"/metrics|/health|/test-health.*"}[1m])) or on() vector(0)
            instant: true
            range: false
            editorMode: code
            legendFormat: __auto
            intervalMs: 1000
            maxDataPoints: 43200
        - refId: B
          relativeTimeRange:
            from: 600
            to: 0
          datasourceUid: prometheus
          model:
            refId: B
            expr: sum(rate(pharmago_http_requests_total{exported_job="PharmaGo.ApiGateway", endpoint!~"/metrics|/health|/test-health.*"}[1m] offset 5m)) or on() vector(0)
            instant: true
            range: false
            editorMode: code
            legendFormat: __auto
            intervalMs: 1000
            maxDataPoints: 43200
        - refId: C
          datasourceUid: __expr__
          model:
            refId: C
            type: math
            expression: "$B > 1 && $A < 0.1 * $B"
            datasource:
              type: __expr__
              uid: __expr__
        noDataState: OK
        execErrState: Error
        for: 30s
        isPaused: false
        labels:
          severity: warning
          senal: trafico
        annotations:
          summary: El tráfico del Gateway cayó más de 90 % respecto de hace 5 min
          description: Había más de 1 req/s hace 5 minutos y ahora llega menos del 10 % de eso. Indica que los clientes no llegan al Gateway (red, port-forward, frontend caído) o que el Gateway dejó de reportar.
    - orgId: 1
      name: pharmago-infraestructura
      folder: PharmaGo
      interval: 10s
      rules:
      - uid: pharmago-cpu-contenedor
        title: CPU del contenedor saturada (throttling)
        condition: C
        data:
        - refId: A
          relativeTimeRange:
            from: 600
            to: 0
          datasourceUid: prometheus
          model:
            refId: A
            expr: max by (pod, container) (rate(container_cpu_cfs_throttled_periods_total{namespace="pharmago", container=~"pharmago-api-gateway|pharmago-users-service|pharmago-pharmacy-service|pharmago-ui"}[1m]))
            instant: true
            range: false
            editorMode: code
            legendFormat: __auto
            intervalMs: 1000
            maxDataPoints: 43200
        - refId: B
          datasourceUid: __expr__
          model:
            refId: B
            type: reduce
            expression: A
            reducer: last
            datasource:
              type: __expr__
              uid: __expr__
            settings:
              mode: replaceNN
              replaceWithValue: 0
        - refId: C
          datasourceUid: __expr__
          model:
            refId: C
            type: threshold
            expression: B
            datasource:
              type: __expr__
              uid: __expr__
            conditions:
            - evaluator:
                type: gt
                params:
                - 3
        noDataState: OK
        execErrState: Error
        for: 30s
        isPaused: false
        labels:
          severity: warning
          senal: saturacion
        annotations:
          summary: "{{ $labels.pod }} fue limitado por su cuota de CPU {{ if $values.B }}{{ humanize $values.B.Value }}{{ end }} veces por segundo"
          description: 'El contenedor pide más CPU que su límite y el kernel lo frena (throttling CFS): con períodos de 100 ms, más de 3 períodos limitados por segundo es más del 30 % del tiempo sin CPU. Sube la latencia. Mirar los paneles de CPU vs. límite y throttling del dashboard Golden Signals.'
      - uid: pharmago-memoria-contenedor
        title: Memoria del contenedor > 80 % de su límite
        condition: C
        data:
        - refId: A
          relativeTimeRange:
            from: 600
            to: 0
          datasourceUid: prometheus
          model:
            refId: A
            expr: max by (pod, container) (container_memory_working_set_bytes{namespace="pharmago", container=~"pharmago-api-gateway|pharmago-users-service|pharmago-pharmacy-service|pharmago-ui"}) / max by (pod, container) (container_spec_memory_limit_bytes{namespace="pharmago", container=~"pharmago-api-gateway|pharmago-users-service|pharmago-pharmacy-service|pharmago-ui"} > 0)
            instant: true
            range: false
            editorMode: code
            legendFormat: __auto
            intervalMs: 1000
            maxDataPoints: 43200
        - refId: B
          datasourceUid: __expr__
          model:
            refId: B
            type: reduce
            expression: A
            reducer: last
            datasource:
              type: __expr__
              uid: __expr__
            settings:
              mode: replaceNN
              replaceWithValue: 0
        - refId: C
          datasourceUid: __expr__
          model:
            refId: C
            type: threshold
            expression: B
            datasource:
              type: __expr__
              uid: __expr__
            conditions:
            - evaluator:
                type: gt
                params:
                - 0.8
        noDataState: OK
        execErrState: Error
        for: 30s
        isPaused: false
        labels:
          severity: warning
          senal: saturacion
        annotations:
          summary: "{{ $labels.pod }} usa {{ if $values.B }}{{ humanizePercentage $values.B.Value }}{{ end }} de su límite de memoria"
          description: 'El working set del contenedor se acerca a su límite: si lo alcanza, el kernel lo mata (OOMKilled) y el pod se reinicia.'
      - uid: pharmago-disco-nodo
        title: Consumo anómalo de disco en el nodo (> 150 MiB en 2 min)
        condition: C
        data:
        - refId: A
          relativeTimeRange:
            from: 600
            to: 0
          datasourceUid: prometheus
          model:
            refId: A
            expr: min(node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs|nsfs|ramfs"} - node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs|nsfs|ramfs"} offset 2m)
            instant: true
            range: false
            editorMode: code
            legendFormat: __auto
            intervalMs: 1000
            maxDataPoints: 43200
        - refId: B
          datasourceUid: __expr__
          model:
            refId: B
            type: reduce
            expression: A
            reducer: last
            datasource:
              type: __expr__
              uid: __expr__
            settings:
              mode: replaceNN
              replaceWithValue: 0
        - refId: C
          datasourceUid: __expr__
          model:
            refId: C
            type: threshold
            expression: B
            datasource:
              type: __expr__
              uid: __expr__
            conditions:
            - evaluator:
                type: lt
                params:
                - -157286400
        noDataState: OK
        execErrState: Error
        for: 0s
        isPaused: false
        labels:
          severity: warning
          senal: saturacion
        annotations:
          summary: El espacio libre del nodo bajó {{ if $values.B }}{{ humanize1024 $values.B.Value }}{{ end }}B en 2 minutos
          description: 'Detector de tasa de consumo: el disco del nodo perdió más de 150 MiB libres en 2 minutos. Un umbral en % no sirve porque el disco de la VM es grande; lo anómalo es la velocidad. Se resuelve solo cuando la escritura para.'
